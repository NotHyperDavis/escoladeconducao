<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Escola de Condução</title>
<link rel="stylesheet" href="main.css">
</head>
<body>

<header>
  <h1>Escola de Condução</h1>
</header>

<nav>
  <button class="tab-btn active" data-tab="alunos">Alunos</button>
  <button class="tab-btn" data-tab="instrutores">Instrutores</button>
  <button class="tab-btn" data-tab="veiculos">Veículos</button>
  <button class="tab-btn" data-tab="aulas">Aulas</button>
</nav>

<main>

  <!-- ALUNOS -->
  <section id="alunos" class="active">
    <h2>Alunos</h2>
    <div class="msg" id="msg-alunos"></div>
    <form class="form-registo" id="form-alunos">
      <input type="hidden" name="id">
      <input type="text" name="nome" placeholder="Nome" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="text" name="telefone" placeholder="Telefone" required>
      <button type="submit">Criar</button>
      <button type="button" class="cancelar">Cancelar</button>
    </form>
    <table>
      <thead><tr><th>ID</th><th>Nome</th><th>Email</th><th>Telefone</th><th>Ações</th></tr></thead>
      <tbody id="tabela-alunos"></tbody>
    </table>
  </section>

  <!-- INSTRUTORES -->
  <section id="instrutores">
    <h2>Instrutores</h2>
    <div class="msg" id="msg-instrutores"></div>
    <form class="form-registo" id="form-instrutores">
      <input type="hidden" name="id">
      <input type="text" name="nome" placeholder="Nome" required>
      <input type="text" name="categoriasHabilitado" placeholder="Categorias (ex: B, A1)" required>
      <button type="submit">Criar</button>
      <button type="button" class="cancelar">Cancelar</button>
    </form>
    <table>
      <thead><tr><th>ID</th><th>Nome</th><th>Categorias</th><th>Ações</th></tr></thead>
      <tbody id="tabela-instrutores"></tbody>
    </table>
  </section>

  <!-- VEICULOS -->
  <section id="veiculos">
    <h2>Veículos</h2>
    <div class="msg" id="msg-veiculos"></div>
    <form class="form-registo" id="form-veiculos">
      <input type="hidden" name="id">
      <input type="text" name="matricula" placeholder="Matrícula" required>
      <input type="text" name="categoria" placeholder="Categoria (ex: B)" required>
      <input type="text" name="estado" placeholder="Estado (ex: DISPONIVEL)" required>
      <button type="submit">Criar</button>
      <button type="button" class="cancelar">Cancelar</button>
    </form>
    <table>
      <thead><tr><th>ID</th><th>Matrícula</th><th>Categoria</th><th>Estado</th><th>Ações</th></tr></thead>
      <tbody id="tabela-veiculos"></tbody>
    </table>
  </section>

  <!-- AULAS -->
  <section id="aulas">
    <h2>Aulas</h2>
    <div class="msg" id="msg-aulas"></div>
    <form class="form-registo" id="form-aulas">
      <input type="number" name="alunoId" placeholder="ID do aluno" required>
      <input type="number" name="instrutorId" placeholder="ID do instrutor" required>
      <input type="number" name="veiculoId" placeholder="ID do veículo (opcional)">
      <select name="tipo">
        <option value="TEORICA">Teórica</option>
        <option value="PRATICA">Prática</option>
      </select>
      <input type="datetime-local" name="dataHoraInicio" required>
      <input type="datetime-local" name="dataHoraFim" required>
      <button type="submit">Marcar aula</button>
    </form>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Aluno</th><th>Instrutor</th><th>Veículo</th>
          <th>Tipo</th><th>Início</th><th>Fim</th><th>Estado</th><th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabela-aulas"></tbody>
    </table>
  </section>

</main>

<script src="main.js"></script>
</body>
</html>
